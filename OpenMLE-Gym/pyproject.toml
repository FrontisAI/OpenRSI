[project]
name = "openmle-gym"
version = "0.1.0"
description = "Tools for building, inspecting, and evaluating standardized Kaggle-style ML task packages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
build = [
    "kaggle>=1.6",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.2",
    "py7zr>=0.21",
    "pyyaml>=6.0",
]
evaluator = [
    "anthropic>=0.34",
    "langchain-openai>=0.1",
    "python-dotenv>=1.0",
]
all = [
    "anthropic>=0.34",
    "kaggle>=1.6",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.2",
    "py7zr>=0.21",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
openmle-task = "openmle_gym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openmle_gym"]

[tool.hatch.build.targets.wheel.force-include]
"builder_core" = "builder_core"
"metadata_pipeline" = "metadata_pipeline"
"examples" = "examples"
"scripts" = "scripts"
