_target_: litellm.Router
_convert_: all

model_list:
  - model_name: zai/glm-4.7
    litellm_params: # https://huggingface.co/zai-org/GLM-4.7#evaluation-parameters
      model: zai/glm-4.7
      api_key: ${oc.env:ZAI_API_KEY}
      base_url: ${oc.env:ZAI_API_BASE,https://api.z.ai/api/paas/v4}
      temperature: 0.7
      top_p: 1.0
      max_tokens: 32768
      timeout: 600
      num_retries: 10
