runner:
  package_root: third_party/aira-evo
  task_root: third_party/aira-evo/examples/mle_bench
  strict_resume: false
  task_list: []
  task_concurrency: null
  submit_dir: MLTasks/MLE-Bench-Lite-Modified
  submit_data_dir_root: ${oc.env:OPENMLE_TASK_DATA_ROOT}
  cpu_base_url: ${oc.env:OPENMLE_SANDBOX_CPU_URL,${oc.env:OPENMLE_SANDBOX_GPU_URL}}
  gpu_base_url: ${oc.env:OPENMLE_SANDBOX_GPU_URL}
  llm:
    api: litellm
    use_azure_client: false
    provider: selfhosted
  solver:
    step_limit: 800
    num_islands: 1
    max_island_size: 500
    crossover_prob: 0.5
    migration_prob: 0.0
    initial_temp: 1.0
    final_temp: 1.0
    num_generations_till_migration: 999
    num_generations_till_crossover: 2
    num_generations: 100
    individuals_per_generation: 5
    max_debug_depth: 10
    max_debug_time: 21600
    data_preview: true
    use_test_score: false
    use_complexity: false
    execution_timeout: 14400
    export_search_results: true
  interpreter:
    use_symlinks: true
  logger:
    use_console: true
    use_json: true
    use_wandb: false
