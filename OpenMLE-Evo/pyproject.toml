[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openmle-tts-eval"
version = "0.1.0"
description = "OpenMLE test-time search and evaluation runtime"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "black>=24.0",
  "httpx>=0.27",
  "hydra-core==1.3.2",
  "litellm==1.65.7",
  "omegaconf==2.3.0",
  "pandas==2.2.3",
  "pyarrow>=15.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["tts_search*"]

[tool.setuptools.package-data]
tts_search = ["configs/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "third_party/aira-evo/tests"]
